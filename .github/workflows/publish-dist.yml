# Publishes UV's build output as a GitHub Release on every push to morphosource.
# MorphoSource (the Rails app) fetches dist.tar.gz from the release tagged with
# the exact commit SHA it was built from, instead of vendoring dist/ by hand.

name: Publish dist to Release

on:
  push:
    branches: ["morphosource"]

permissions:
  contents: write

concurrency:
  group: publish-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dist
        run: tar -czf dist.tar.gz -C dist .

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing its asset."
            gh release upload "$TAG" dist.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Automated UV build for commit ${{ github.sha }}."
          fi
